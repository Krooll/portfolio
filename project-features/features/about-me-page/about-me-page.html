<div class="page-wrapper h-100 p-2">
  <div class="d-flex align-items-center">
    <div class="img-wrapper d-flex align-items-center justify-content-center me-2">
      <img loading="lazy" class="img" src="/icons/dev.png" alt="customer" />
    </div>
    <p>{{ 'aboutMe' | translateFallback: 'O mnie' }}</p>
  </div>
  <hr />
  <div class="body-scroll d-flex">
      <div scrollReveal class="reveal-anim d-flex flex-wrap">
        @for(item of aboutMeList; track $index ) {
          <div class="text-wrapper" [ngClass]="{
        'neon-blue' : item.color === 'blue',
        'neon-pink' : item.color === 'pink'
      }">
            <h1>{{item.title | translateFallback: item.titleFallback }}</h1>
            <p>{{item.description | translateFallback: item.description }}</p>
          </div>
        }

      </div>
  </div>
</div>
